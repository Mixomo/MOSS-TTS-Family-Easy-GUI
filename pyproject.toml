[project]
name = "moss-tts-easy-gui"
version = "1.0.5"
description = "MOSS-TTS Family Easy GUI for Windows NVIDIA CUDA"
requires-python = "==3.12.*"
dependencies = [
  "accelerate==1.10.1",
  "ctranslate2==4.8.1",
  "einops==0.8.1",
  "faster-whisper==1.2.1",
  "gradio==6.11.0",
  "huggingface-hub==1.3.0",
  "hf-xet==1.6.0",
  "librosa==0.11.0",
  "numpy==2.1.0",
  "orjson==3.11.4",
  "onnxruntime-gpu==1.28.0",
  "peft==0.18.1",
  "psutil==7.0.0",
  "pyyaml==6.0.3",
  "safetensors==0.6.2",
  "sentencepiece==0.2.0",
  "scipy==1.16.2",
  "soundfile==0.13.1",
  "tiktoken==0.12.0",
  "tensorboard==2.20.0",
  "setuptools==80.9.0",
  "torch==2.9.0",
  "torchaudio==2.9.0",
  "tqdm==4.67.1",
  "transformers==5.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

